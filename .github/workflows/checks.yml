name: Code quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20.15.0', '20.x']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: convora
          POSTGRES_PASSWORD: convora
          POSTGRES_DB: convora_test
        ports: ['54330:5432']
        options: >-
          --health-cmd "pg_isready -U convora -d convora_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://convora:convora@127.0.0.1:54330/convora_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:node
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
